<section class="sedes-section" aria-labelledby="sedes-heading">
  <div class="sedes-section__inner">
    <!-- Header -->
    <div class="sedes-section__header">
      <h2 id="sedes-heading" class="sedes-section__title">
        {{ sectionTitle() }}
      </h2>

      <div class="sedes-section__line" aria-hidden="true"></div>

      <!-- Sede Tab / Badge -->
      <div class="sedes-section__tab-wrapper">
        <span class="sedes-section__tab">
          <i class="pi pi-map-marker" aria-hidden="true"></i>
          <span>{{ sedeName() }}</span>
        </span>
      </div>

      <!-- Address and Operating Hours -->
      <div class="sedes-section__info">
        <p class="sedes-section__address">
          <strong>Dirección:</strong> {{ address() }}
        </p>

        <p class="sedes-section__schedule">
          <i class="pi pi-clock" aria-hidden="true"></i>
          <span>{{ scheduleWeek() }}</span>
          <span class="sedes-section__separator">|</span>
          <span>{{ scheduleWeekend() }}</span>
        </p>

        @if (phone()) {
          <p class="sedes-section__phone">
            <i class="pi pi-phone" aria-hidden="true"></i>
            <span><strong>Teléfonos:</strong> {{ phone() }}</span>
          </p>
        }
      </div>
    </div>

    <!-- Map Container -->
    <div class="sedes-map">
      <!-- Floating Direct Google Maps Button -->
      <a
        [href]="googleMapsUrl()"
        target="_blank"
        rel="noopener noreferrer"
        class="sedes-map__cta-btn"
        aria-label="Abrir ubicación en Google Maps"
      >
        <i class="pi pi-external-link" aria-hidden="true"></i>
        <span>Ver en Google Maps</span>
      </a>

      <!-- Embedded Interactive Map -->
      <iframe
        [src]="mapEmbedUrl()"
        class="sedes-map__iframe"
        title="Mapa de ubicación Grass San José"
        loading="lazy"
        referrerpolicy="no-referrer-when-downgrade"
        allowfullscreen
      ></iframe>
    </div>
  </div>
</section>
